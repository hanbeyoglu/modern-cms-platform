name: Docker images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build timestamp
        id: ts
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          cache-from: type=gha,scope=cms-api
          cache-to: type=gha,scope=cms-api,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.ts.outputs.iso }}
            APP_VERSION=0.0.0-ci

      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.admin
          push: false
          cache-from: type=gha,scope=cms-admin
          cache-to: type=gha,scope=cms-admin,mode=max
          build-args: |
            VITE_API_URL=http://localhost:4000

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          cache-from: type=gha,scope=cms-worker
          cache-to: type=gha,scope=cms-worker,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.ts.outputs.iso }}
            APP_VERSION=0.0.0-ci

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          API_BASE_URL=https://cms-api.example.com VITE_API_URL=https://cms-api.example.com DATABASE_URL=postgresql://cms:cms@postgres:5432/cms REDIS_URL=redis://redis:6379 POSTGRES_USER=cms POSTGRES_PASSWORD=ci-only-password POSTGRES_DB=cms JWT_SECRET=ci-only-jwt-secret-at-least-32-characters JWT_REFRESH_SECRET=ci-only-refresh-secret-at-least-32-characters docker compose --env-file /dev/null -f docker-compose.prod.yml config --quiet
