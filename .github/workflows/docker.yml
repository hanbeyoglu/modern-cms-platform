name: Docker images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build timestamp
        id: ts
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.ts.outputs.iso }}
            APP_VERSION=0.0.0-ci

      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.admin
          push: false
          build-args: |
            VITE_API_URL=http://localhost:4000

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.ts.outputs.iso }}
            APP_VERSION=0.0.0-ci

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null
