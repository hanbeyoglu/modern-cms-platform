name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cms:cms@localhost:5432/cms?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - name: Shell script validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(infra/scripts/*.sh)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts under infra/scripts/"
            exit 1
          fi
          for f in "${scripts[@]}"; do
            chmod +x "$f"
            bash -n "$f"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma Client generate (monorepo)
        run: pnpm db:generate

      - name: Prisma validate
        run: pnpm --filter @modern-cms/api exec prisma validate

      - name: Prisma migrate deploy
        run: pnpm --filter @modern-cms/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      # Turbo strict env mode (CI=true) does not pass job env vars to tasks.
      # Nest ConfigModule loads ../../.env during OpenAPI generation (full app boot).
      - name: Prepare env file for build
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          JWT_SECRET=${JWT_SECRET}
          EOF

      - name: Build
        run: pnpm build

      - name: Validate OpenAPI spec
        run: |
          test -f apps/api/openapi/openapi.json
          test -f apps/api/openapi/openapi.en.json
          test -f apps/api/openapi/openapi.ru.json
          node -e "
          const fs=require('fs');
          for (const f of ['openapi.json','openapi.en.json','openapi.ru.json']) {
            const s=JSON.parse(fs.readFileSync('apps/api/openapi/'+f,'utf8'));
            if(!s.openapi?.startsWith('3.')) process.exit(1);
            if(Object.keys(s.paths||{}).length===0) process.exit(1);
            if(!s.info['x-portal-locale']) process.exit(1);
          }
          console.log('OpenAPI i18n OK: tr/en/ru');
          "

      - name: API build (Nest DI smoke prerequisite)
        run: pnpm --filter @modern-cms/api build

      - name: Smoke (Nest DI + DB)
        run: pnpm --filter @modern-cms/api run smoke:di:dist

      - name: Docker Compose config (dev)
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Docker Compose config (prod example)
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null
