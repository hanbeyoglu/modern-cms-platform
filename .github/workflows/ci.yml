name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cms:cms@localhost:5432/cms?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - name: Shell script validation
        run: |
          set -e
          for f in infra/scripts/*.sh; do
            [[ -f "$f" ]] || continue
            chmod +x "$f"
            bash -n "$f"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck infra/scripts/*.sh
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @modern-cms/api exec prisma validate

      - name: Prisma migrate deploy
        run: pnpm --filter @modern-cms/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke (Nest DI + DB)
        run: pnpm --filter @modern-cms/api exec tsx src/smoke-di.ts

      - name: Docker Compose config (dev)
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Docker Compose config (prod example)
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null
