# Production Stack
# Usage:
# docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

services:
  # Run explicitly before starting updated application images. Not a long-running service.
  migrate:
    profiles: ['tools']
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: build
    command: ['pnpm', '--filter', '@modern-cms/api', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
    networks:
      - modern-cms

  postgres:
    container_name: modern-cms-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    expose:
      - '5432'
    volumes:
      - modern_cms_postgres_data:/var/lib/postgresql/data
    networks:
      - modern-cms
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: modern-cms-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    environment:
      TZ: UTC
    expose:
      - '6379'
    volumes:
      - modern_cms_redis_data:/data
    networks:
      - modern-cms
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    container_name: modern-cms-api
    init: true
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.0.0}
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: UTC
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL required}
      STORAGE_ROOT: /app/storage
      AUDIT_ENABLED: ${AUDIT_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:-}
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_GIT_SHA: ${GIT_SHA:-unknown}
      APP_BUILD_TIME: ${BUILD_TIME:-unknown}
    volumes:
      - modern_cms_media_data:/app/storage
    ports:
      - '${API_PUBLISH_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - modern-cms
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.API_PORT||4000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  admin:
    container_name: modern-cms-admin
    init: true
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL required}
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: UTC
    ports:
      - '${ADMIN_PUBLISH_PORT:-4001}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - modern-cms
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    container_name: modern-cms-worker
    init: true
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.0.0}
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: UTC
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-60000}
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_GIT_SHA: ${GIT_SHA:-unknown}
      APP_BUILD_TIME: ${BUILD_TIME:-unknown}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - modern-cms
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const Redis=require('ioredis');const r=new Redis(process.env.REDIS_URL,{maxRetriesPerRequest:1,connectTimeout:3000});r.get('worker:heartbeat').then(v=>r.quit().then(()=>process.exit(v?0:1))).catch(()=>process.exit(1))",
        ]
      interval: 45s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  modern_cms_media_data:
    name: modern-cms-media-data

  modern_cms_postgres_data:
    name: modern-cms-postgres-data

  modern_cms_redis_data:
    name: modern-cms-redis-data

networks:
  modern-cms:
    name: modern-cms
    driver: bridge
